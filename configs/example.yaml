# Paths are relative to this YAML file. Prepare/train locally first.
inputs:
  train: ../data/prepared/train.csv
  reference: ../data/prepared/reference.csv
  current: null
  current_labeled: false
artifact:
  path: ../models/baseline/logistic_regression.joblib
  # Only use your locally trained/trusted artifact: joblib can execute code.
  trust: true
  expected_sha256: null  # Optionally pin your local artifact's SHA256.
output: ../reports/generated/phase6_logistic.json
seed: 42  # Recorded only: no training, resplitting or randomness in validation.
decision_threshold: 0.5
# Remaining defaults are the explicit Telco roles/types from Phase 1.
data:
  target_column: Churn
  target_labels: [0, 1]
  positive_class_label: 1
  identifier_columns: [customerID]
  segment_column: Contract
  max_missing_fraction: 0.05
  max_duplicate_row_fraction: 0.0
  max_duplicate_id_fraction: 0.0
  max_identifier_overlap_fraction: 0.0
model:
  enabled: true
  thresholds: [0.30, 0.40, 0.50, 0.60, 0.70]
  calibration_bins: 10
  min_f1: null  # Descriptive, not a release quality bar.
  max_brier_score: null
segment:
  enabled: true
  min_segment_size: 50
drift:
  enabled: true
  min_sample_size: 50
  smoothing: 0.000001
performance:
  enabled: true
  min_sample_size: 50
