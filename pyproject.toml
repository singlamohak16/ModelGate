[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "modelgate"
dynamic = ["version"]
description = "Offline validation evidence for scikit-learn binary classifiers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "ModelGate contributors" }]
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pydantic>=2.7,<3",
    "PyYAML>=6,<7",
    "scikit-learn>=1.5,<2",
    "scipy>=1.11,<2",
    "joblib>=1.4,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.6,<1",
    "coverage>=7.10.6,<8",
    "build>=1.2,<2",
]

[project.scripts]
modelgate = "modelgate.cli:main"

[tool.setuptools.dynamic]
version = { attr = "modelgate.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
branch = true
source = ["modelgate"]
parallel = true
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
precision = 2
# Branch-aware combined coverage is gated too; line coverage is checked separately.
fail_under = 90

[tool.coverage.xml]
output = "artifacts/ci/coverage.xml"

[tool.coverage.json]
output = "artifacts/ci/coverage.json"
